name: ✨ Feature Request
description: Propose a new feature, enhancement, or export format support
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make WA Archiver better! Please describe your idea and use case.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you're encountering.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear description of what you want to happen and how you envision using it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives You've Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context or Mockups
      description: Add any mockups, screenshots, or additional context about the feature request.
